<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kleavox is a focused ecosystem for routes, temporary files, identity, and infrastructure monitoring."
    />
    <meta name="theme-color" content="#070810" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Kleavox | Focused systems" />
    <meta
      property="og:description"
      content="Routes, temporary files, identity, and infrastructure monitoring under one deliberate system."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ROOT_ORIGIN}}" />
    <link rel="canonical" href="{{ROOT_ORIGIN}}" />
    <title>Kleavox | Focused systems</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header data-app-header></header>
    <template data-header-account>
      <div class="account" data-account>
        <a class="btn-nav" href="{{PASS_SIGNIN_HREF}}" data-signin> Sign in </a>
        <div class="account-menu" data-account-menu hidden>
          <button
            type="button"
            class="account-trigger"
            data-account-trigger
            aria-expanded="false"
          >
            <span data-account-name></span>
          </button>
          <div class="account-dropdown" data-account-dropdown hidden>
            <button type="button" data-logout>Sign out</button>
          </div>
        </div>
      </div>
    </template>

    <main class="kvx-main shell">
      <h1 data-status-line></h1>
      <section data-attention hidden>
        <p class="kvx-section-label">Needs you <b data-attention-count></b></p>
        <ul class="kvx-rows" data-attention-rows></ul>
      </section>
      <section>
        <p class="kvx-section-label">Tools <b data-tools-count>3</b></p>
        <ul class="kvx-rows" data-tools></ul>
      </section>
      <div data-home-status></div>
    </main>

    <footer class="ftr">
      <div class="shell ftr-inner">
        <span class="ftr-wm">Kleav<b>ox</b></span>
        <div class="ftr-links">
          <a href="{{LINK_HREF}}">Link</a>
          <a href="{{PASS_HREF}}">Pass</a>
          <a href="{{PULSE_HREF}}" data-pulse-only hidden>Pulse</a>
          <a href="{{PORT_HREF}}">Port</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </div>
        <span class="ftr-copy">&copy; {{YEAR}} Kleavox</span>
      </div>
    </footer>
  </body>
</html>
