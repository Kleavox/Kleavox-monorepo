<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kleavox is a focused ecosystem for routes, temporary files, identity, and infrastructure monitoring."
    />
    <meta name="theme-color" content="#070908" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Kleavox | Focused systems" />
    <meta
      property="og:description"
      content="Routes, temporary files, identity, and infrastructure monitoring under one deliberate system."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ROOT_ORIGIN}}" />
    <link rel="canonical" href="{{ROOT_ORIGIN}}" />
    <title>Kleavox | Focused systems</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header data-app-header></header>
    <template data-header-account>
      <div class="account" data-account>
        <a class="btn-nav" href="{{PASS_SIGNIN_HREF}}" data-signin> Sign in </a>
        <div class="account-menu" data-account-menu hidden>
          <button
            type="button"
            class="account-trigger"
            data-account-trigger
            aria-expanded="false"
          >
            <span data-account-name></span>
          </button>
          <div class="account-dropdown" data-account-dropdown hidden>
            <button type="button" data-logout>Sign out</button>
          </div>
        </div>
      </div>
    </template>

    <main class="machine-room">
      <section class="stage" aria-label="Kleavox software vending machine">
        <div
          class="machine"
          data-machine
          data-access="guest"
          data-status="idle"
        >
          <section class="cabinet" aria-label="Application inventory">
            <div class="door">
              <div class="inventory">
                <header class="inventory-header">
                  <h1 class="machine-wordmark">KLEAVOX</h1>
                  <span class="cabinet-state" data-cabinet-state
                    >GUEST MODE</span
                  >
                </header>

                <div
                  class="shelf shelf--primary"
                  data-shelf
                  role="group"
                  aria-label="Bays 1 to 3, three applications"
                >
                  <div class="slot" data-bay="1">
                    <span class="bay-backlight" data-backlight></span>
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <button
                      class="cartridge cartridge--link"
                      type="button"
                      data-cartridge="1"
                      data-href="{{LINK_HREF}}"
                      aria-label="Select Link, bay 1"
                    >
                      <span class="cartridge__detail"></span>
                      <span class="cartridge__name">LINK</span>
                    </button>
                    <span class="slot-code">
                      <span>1 &middot; <strong>LINK</strong></span>
                      <span class="slot-code__scope">Visitor</span>
                    </span>
                  </div>

                  <div class="slot" data-bay="2">
                    <span class="bay-backlight" data-backlight></span>
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <button
                      class="cartridge cartridge--pulse"
                      type="button"
                      data-cartridge="2"
                      data-href="{{PULSE_HREF}}"
                      aria-label="Select Pulse, bay 2"
                    >
                      <span class="cartridge__detail"></span>
                      <span class="cartridge__name">PULSE</span>
                    </button>
                    <span class="slot-code">
                      <span>2 &middot; <strong>PULSE</strong></span>
                      <span class="slot-code__scope">Owner</span>
                    </span>
                  </div>

                  <div class="slot" data-bay="3">
                    <span class="bay-backlight" data-backlight></span>
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <button
                      class="cartridge cartridge--portfolio"
                      type="button"
                      data-cartridge="3"
                      data-href="{{PORT_HREF}}"
                      aria-label="Select Portfolio, bay 3"
                    >
                      <span class="cartridge__detail"></span>
                      <span class="cartridge__name">PORT</span>
                    </button>
                    <span class="slot-code">
                      <span>3 &middot; <strong>PORT</strong></span>
                      <span class="slot-code__scope">Public</span>
                    </span>
                  </div>
                </div>

                <div
                  class="shelf"
                  data-shelf
                  role="group"
                  aria-label="Bays 4 to 6, three empty bays"
                >
                  <div class="slot slot--empty" data-bay="4" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">4 &middot; EMPTY</span>
                  </div>
                  <div class="slot slot--empty" data-bay="5" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">5 &middot; EMPTY</span>
                  </div>
                  <div class="slot slot--empty" data-bay="6" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">6 &middot; EMPTY</span>
                  </div>
                </div>

                <div
                  class="shelf"
                  data-shelf
                  role="group"
                  aria-label="Bays 7 to 9, three empty bays"
                >
                  <div class="slot slot--empty" data-bay="7" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">7 &middot; EMPTY</span>
                  </div>
                  <div class="slot slot--empty" data-bay="8" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">8 &middot; EMPTY</span>
                  </div>
                  <div class="slot slot--empty" data-bay="9" aria-hidden="true">
                    <span class="coil"
                      ><i></i><i></i><i></i><i></i><i></i
                    ></span>
                    <span class="empty-stop"></span>
                    <span class="slot-code">9 &middot; EMPTY</span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="ftr">
      <div class="shell ftr-inner">
        <span class="ftr-wm">Kleav<b>ox</b></span>
        <div class="ftr-links">
          <a href="{{LINK_HREF}}">Link</a>
          <a href="{{PASS_HREF}}">Pass</a>
          <a href="{{PULSE_HREF}}" data-pulse-only hidden>Pulse</a>
          <a href="{{PORT_HREF}}">Port</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </div>
        <span class="ftr-copy">&copy; {{YEAR}} Kleavox</span>
      </div>
    </footer>
  </body>
</html>
